---
# Read the join token straight from the control plane node so this role works
# in any play (e.g. --limit workers or recover-node.yml) without depending on
# facts set by an earlier k3s_server play in the same run.
- name: Read k3s join token from control plane
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ groups['controlplane'][0] }}"
  register: k3s_agent_node_token
  no_log: true

- name: Set k3s join facts
  ansible.builtin.set_fact:
    k3s_agent_server_token: "{{ k3s_agent_node_token.content | b64decode | trim }}"
    k3s_agent_server_url: "https://{{ hostvars[groups['controlplane'][0]]['ansible_host'] }}:6443"
  no_log: true

- name: Check if k3s-agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Check installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_installed_version
  changed_when: false
  failed_when: false
  when: k3s_agent_binary.stat.exists

- name: Determine whether k3s install is needed
  ansible.builtin.set_fact:
    k3s_agent_install_needed: >-
      {{ not k3s_agent_binary.stat.exists
         or k3s_version not in (k3s_agent_installed_version.stdout | default('')) }}

- name: Check if k3s-agent service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Create node password directory
  ansible.builtin.file:
    path: /etc/rancher/node
    state: directory
    mode: "0700"

# 0600: the config embeds the cluster join token
- name: Create k3s agent config BEFORE installation
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s-agent

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
    timeout: 30
  register: k3s_agent_install_script
  until: k3s_agent_install_script is succeeded
  retries: 3
  delay: 5
  when: k3s_agent_install_needed | bool

# Security: The install script verifies the k3s binary using SHA256 checksums
# from GitHub releases. We verify the installed binary post-installation.
# Also runs when k3s_version differs from the installed binary, upgrading it.
- name: Install k3s agent
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_agent_server_url }}"
    K3S_TOKEN: "{{ k3s_agent_server_token }}"
  ansible.builtin.command: /tmp/k3s-install.sh agent
  changed_when: true
  when: k3s_agent_install_needed | bool

- name: Verify k3s binary version matches expected
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_version_check
  changed_when: false
  failed_when: k3s_version not in k3s_agent_version_check.stdout

- name: Ensure k3s-agent service is started
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
  when: k3s_agent_service.stat.exists

- name: Wait for agent to join cluster
  delegate_to: "{{ groups['controlplane'][0] }}"
  ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
  register: k3s_agent_node_joined
  until: k3s_agent_node_joined.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for node to be Ready
  delegate_to: "{{ groups['controlplane'][0] }}"
  ansible.builtin.command: >
    k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  register: k3s_agent_node_ready
  changed_when: false
