---
# Molecule configuration for base role
# Tests system configuration, packages, kernel modules, and sysctl settings

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: false

driver:
  name: docker

# The platform name doubles as the Docker container name, which is unique per
# Docker host. CI sets MOLECULE_PLATFORM_SUFFIX (e.g. -<run_id>) so concurrent
# workflow runs on the same runner host don't fight over one container;
# locally the suffix is empty and the name stays base-test.
platforms:
  - name: base-test${MOLECULE_PLATFORM_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      base-test${MOLECULE_PLATFORM_SUFFIX}:
        ansible_host: base-test${MOLECULE_PLATFORM_SUFFIX}
        inventory_hostname: base-test${MOLECULE_PLATFORM_SUFFIX}
    group_vars:
      all:
        tpi_bmc_host: "10.10.88.70"
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_EPHEMERAL_DIRECTORY}/roles
      callbacks_enabled: profile_tasks
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule_facts
      fact_caching_timeout: 3600
    ssh_connection:
      pipelining: true

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
