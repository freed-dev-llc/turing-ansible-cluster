---
# Molecule configuration for k3s_server role
# Uses Docker with systemd-enabled image for realistic testing

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: false

driver:
  name: docker

# The platform name doubles as the Docker container name, which is unique per
# Docker host. CI sets MOLECULE_PLATFORM_SUFFIX (e.g. -<run_id>) so concurrent
# workflow runs on the same runner host don't fight over one container;
# locally the suffix is empty and the name stays k3s-server-test.
platforms:
  - name: k3s-server-test${MOLECULE_PLATFORM_SUFFIX:-}
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp:exec,mode=1777  # Allow script execution in /tmp
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN

# No published_ports on the platform: k3s never starts here
# (k3s_server_skip_start), so nothing listens on 6443, and a host-port
# publish would collide across concurrent runs on the same runner host.
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      k3s-server-test${MOLECULE_PLATFORM_SUFFIX:-}:
        ansible_host: k3s-server-test${MOLECULE_PLATFORM_SUFFIX:-}
        inventory_hostname: k3s-server-test${MOLECULE_PLATFORM_SUFFIX:-}
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_EPHEMERAL_DIRECTORY}/roles
      callbacks_enabled: profile_tasks
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule_facts
      fact_caching_timeout: 3600
    ssh_connection:
      pipelining: true

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
