---
# Deploy Kubernetes addons via Helm
# Usage: ansible-playbook -i inventories/server/hosts.yml playbooks/addons.yml

- name: Deploy cluster addons
  hosts: controlplane
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../secrets/{{ target_environment | default('server') }}.yml"

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  pre_tasks:
    - name: Install Helm
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
        executable: /bin/bash
      register: addons_helm_install
      until: addons_helm_install is succeeded
      retries: 3
      delay: 10

    - name: Install Python kubernetes module
      ansible.builtin.apt:
        name:
          - python3-kubernetes
          - python3-yaml
        state: present

  roles:
    - metallb
    - nginx_ingress
    - prometheus_stack
    - longhorn
    - portainer

  post_tasks:
    # The prometheus_stack role deploys without waiting (its PVCs need the
    # longhorn StorageClass, created by the later longhorn role), so confirm
    # the monitoring stack actually converged before declaring success.
    - name: Wait for monitoring deployments to become available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Available deployment --all
        -n monitoring --timeout=600s
      register: addons_monitoring_deployments
      changed_when: false
      retries: 3
      delay: 10
      until: addons_monitoring_deployments.rc == 0

    # The prometheus-operator creates these statefulsets asynchronously, so
    # first wait for both (Prometheus + Alertmanager) to exist; a bare
    # `kubectl wait --all` against zero resources would not wait for them.
    - name: Wait for monitoring statefulsets to be created
      ansible.builtin.command: k3s kubectl get statefulset -n monitoring -o name
      register: addons_monitoring_sts_list
      changed_when: false
      retries: 30
      delay: 10
      until: addons_monitoring_sts_list.stdout_lines | length >= 2

    - name: Wait for Prometheus and Alertmanager statefulsets
      ansible.builtin.command: >
        k3s kubectl wait --for=jsonpath='{.status.availableReplicas}'=1
        statefulset --all -n monitoring --timeout=600s
      register: addons_monitoring_statefulsets
      changed_when: false
      retries: 3
      delay: 10
      until: addons_monitoring_statefulsets.rc == 0

    - name: Display addon status
      ansible.builtin.command: k3s kubectl get pods -A
      register: addons_all_pods
      changed_when: false

    - name: Show running pods
      ansible.builtin.debug:
        msg: "{{ addons_all_pods.stdout_lines }}"

    - name: Display access information
      ansible.builtin.debug:
        msg: |
          Cluster addons deployed successfully!

          Add to /etc/hosts:
          {{ ingress_ip }}  grafana.local prometheus.local alertmanager.local longhorn.local

          Access:
          - Grafana: http://grafana.local (admin/<password from secrets>)
          - Prometheus: http://prometheus.local
          - AlertManager: http://alertmanager.local
          - Longhorn: http://longhorn.local
          - Portainer: Connect agent at {{ portainer_server }}:{{ portainer_port }}
