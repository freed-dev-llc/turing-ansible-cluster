version: 2
updates:
  # GitHub Actions
  # (No entry for Ansible Galaxy: Dependabot has no ecosystem for it, and an
  # unsupported value invalidates the whole file, disabling every entry.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/terraform/environments/server"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "terraform"
    labels:
      - "dependencies"
      - "terraform"
